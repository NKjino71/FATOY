<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA 시뮬레이터</title>
<style>
  :root {
    --bg: #1e2329; --panel: #252b32; --line: #333b44; --text: #ecf0f1; --mute: #8e9aa6;
    --ok: #2ecc71; --bad: #e74c3c; --idle: #7f8c8d; --accent: #3498db;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 auto 0 0; }
  button, select { background: #2f3740; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }

  main { position: relative; min-width: 0; min-height: 0; }
  #fa { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 20px; }
  .dash-head { display: flex; justify-content: space-between; align-items: baseline; }
  .dash-head h2 { font-size: 15px; margin: 0; }
  aside section { margin-top: 16px; }
  aside h3 { font-size: 12px; font-weight: 600; color: var(--mute); margin: 0 0 8px; letter-spacing: .02em; }
  aside h3 small { font-weight: 400; }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .kpi { background: #1b2025; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kpi.main { grid-column: 1 / -1; border-color: #2a6b49; }
  .kpi label { display: block; font-size: 11px; color: var(--mute); }
  .kpi b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi.main b { font-size: 32px; color: var(--ok); }
  .kpi small { margin-left: 4px; color: var(--mute); font-size: 11px; }

  canvas.spark { width: 100%; height: 64px; display: block; background: #1b2025;
    border: 1px solid var(--line); border-radius: 8px; }

  .legend { font-size: 11px; color: var(--mute); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .lg { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-left: 6px; }
  .lg.u { background: var(--ok); } .lg.b { background: var(--bad); }

  .mrow { padding: 8px 10px; margin-bottom: 8px; background: #1b2025; border: 1px solid var(--line); border-radius: 8px; }
  .mrow.bn { border-color: var(--bad); box-shadow: 0 0 0 1px rgba(231,76,60,.35); }
  .mrow.bn .nm::after { content: " 병목 후보"; font-size: 10px; color: var(--bad); margin-left: 4px; }
  .mtop { display: flex; align-items: center; gap: 6px; }
  .mtop .nm { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .mrow[data-state="Working"] .dot { background: var(--ok); }
  .mrow[data-state="Blocked"] .dot { background: var(--bad); }
  .pct { font-size: 16px; font-weight: 600; }
  .sub { font-size: 11px; color: var(--mute); margin-top: 3px; }

  .track { position: relative; height: 8px; background: #11151a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .track.thin { height: 6px; margin: 0; flex: 1; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .15s linear; }
  .fill.u { background: var(--ok); z-index: 2; }
  .fill.b { background: var(--bad); z-index: 1; opacity: .75; }
  .fill.w { background: var(--accent); }

  .wrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .wrow .nm { width: 78px; font-size: 12px; color: #c4ccd4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow .val { width: 54px; text-align: right; font-size: 12px; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; min-height: 100%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>FA 라인 시뮬레이터</h1>
      <select id="speed" title="배속">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
        <option value="30">30x</option>
      </select>
      <button id="play">⏸ 일시정지</button>
      <button id="reset">↺ 초기화</button>
    </header>
    <main><canvas id="fa"></canvas></main>
    <aside id="dash"></aside>
  </div>

  <!-- 번들: npx esbuild main.ts --bundle --format=iife --outfile=bundle.js -->
  <script src="./bundle.js"></script>
</body>
</html>
